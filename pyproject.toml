[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "context-diamond"
version = "0.1.0"
description = "Deterministic context compression capsules for LLM workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RainCherb" }]
keywords = [
  "llm",
  "context-compression",
  "tokens",
  "prompt-engineering",
  "ai-agents",
  "benchmarking",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
context-diamond = "context_diamond.cli:main"
ctxd = "context_diamond.cli:main"
context-diamond-bench = "context_diamond.benchmark:main"
ctxd-bench = "context_diamond.benchmark:main"

[project.urls]
Homepage = "https://github.com/RainCherb/context-diamond"
Repository = "https://github.com/RainCherb/context-diamond"
Issues = "https://github.com/RainCherb/context-diamond/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/context_diamond"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
