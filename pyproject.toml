[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-process-pilot"
version = "1.0.1"
description = "Local-first AI work intake, safe model routing, cost estimates and MCP tools for small businesses"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai", "automation", "mcp", "llm", "customer-support", "business"]
dependencies = [
  "fastapi>=0.142,<1",
  "starlette>=1.3,<2",
  "uvicorn>=0.27,<1",
  "httpx>=0.26,<1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
processpilot = "processpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/processpilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/processpilot/web" = "processpilot/web"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
