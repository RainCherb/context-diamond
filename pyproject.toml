[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "context-diamond"
version = "0.7.0"
description = "Auditable context capsules, repo handoffs, and capsule diffs for LLM agents and OpenCode MCP workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "RainCherb" }]
keywords = [
  "llm",
  "context-compression",
  "context-engineering",
  "tokens",
  "prompt-engineering",
  "ai-agents",
  "mcp",
  "opencode",
  "benchmarking",
  "ai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
tiktoken = [
  "tiktoken>=0.7.0",
]
anthropic = [
  "anthropic>=0.30.0",
]
transformers = [
  "transformers>=4.40.0",
  "torch>=2.0.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.10.0",
]

[project.scripts]
context-diamond = "context_diamond.cli:main"
ctxd = "context_diamond.cli:main"
context-diamond-bench = "context_diamond.benchmark:main"
ctxd-bench = "context_diamond.benchmark:main"
context-diamond-mcp = "context_diamond.mcp_server:main"
ctxd-mcp = "context_diamond.mcp_server:main"

[project.urls]
Homepage = "https://github.com/RainCherb/context-diamond"
Repository = "https://github.com/RainCherb/context-diamond"
Issues = "https://github.com/RainCherb/context-diamond/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/context_diamond"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
